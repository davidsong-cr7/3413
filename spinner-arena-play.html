<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spinner Arena</title><style>body{background:#0b1120;color:white;font:15px system-ui;max-width:850px;margin:20px auto;padding:12px}canvas{width:100%;background:#14213a;border-radius:12px;touch-action:none}button{background:#28446c;color:white;border:1px solid #678;border-radius:8px;padding:12px;cursor:pointer;margin:4px}button:disabled{opacity:.4}#info{display:flex;gap:20px;flex-wrap:wrap}h1{color:#8de3ff}</style><h1>⚔ SPINNER ARENA</h1><div id="info"><span id="hp"></span><span id="coin"></span><span id="level"></span><span id="wave"></span></div><canvas id="game" width="800" height="450"></canvas><div><button id="start">▶ 시작 / 계속</button><button id="pause">⏸ 정지</button><button id="reset">↻ 초기화</button><button id="buy">🛒 구매</button><button id="merge">✨ 합성</button><button id="skill">[1] 스킬</button></div><p id="msg">시작 버튼을 누르세요.</p><small>WASD / 방향키 이동 · 자동 발사 · 숫자 1 스킬 · 모바일 터치 이동</small><script>
(()=>{const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),N=['메탈','크리스탈','파이어','아이스','일렉트릭','갤럭시','드래곤','엔젤','데몬','메카','골든 로얄'],C=['#cbd5e1','#38bdf8','#fb633b','#9de8ff','#facc15','#b28aff','#ff8a36','#fff','#d783ff','#22d3ee','#ffd46b'],S=['메탈 러시','수정 파편','화염 폭발','빙결 지대','연쇄 번개','중력 소용돌이','드래곤 브레스','천사의 치유','악마의 저주','메카 미사일','황금 심판'];let p,es,bs,eb,lv,money,owned,t,spawn,fire,cd,fx,run,pause,dead,rot,last=0;const keys={},touch={on:false,x:400,y:225};const atk=()=>Math.round(12*1.65**(lv-1)),cost=()=>Math.round(30*2.05**(lv-1)),wave=()=>1+Math.floor(t/23000),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){p={x:400,y:225,hp:100,inv:0};es=[];bs=[];eb=[];lv=1;money=0;owned=1;t=0;spawn=1800;fire=0;cd=0;fx=[];run=false;pause=false;dead=false;rot=0;$('msg').textContent='시작 버튼을 누르세요.';ui()}function ui(){$('hp').textContent='❤️ '+Math.ceil(p.hp);$('coin').textContent='🪙 '+money;$('level').textContent='⚙ LV.'+lv+' '+N[lv-1]+' · '+owned+'개';$('wave').textContent='WAVE '+wave();$('buy').textContent='🛒 '+cost()+' 코인';$('merge').disabled=owned<2||lv===11;$('skill').textContent='[1] '+S[lv-1]+(cd>0?' '+Math.ceil(cd/1000)+'초':'');$('skill').disabled=cd>0||!run||pause}function spinner(x,y,r,a){g.save();g.translate(x,y);g.rotate(a);g.shadowColor=C[lv-1];g.shadowBlur=12;for(let i=0;i<3;i++){g.save();g.rotate(i*2*Math.PI/3);g.fillStyle=C[lv-1];g.strokeStyle='#fff';g.beginPath();if(lv%3===0){g.moveTo(-r*.4,-r*.15);g.lineTo(-r*.2,-r*.8);g.lineTo(0,-r*1.4);g.lineTo(r*.2,-r*.8);g.lineTo(r*.4,-r*.15)}else{g.moveTo(-r*.35,-r*.1);g.quadraticCurveTo(-r*.6,-r,0,-r*(lv%3===1?1.2:1.45));g.quadraticCurveTo(r*.6,-r,r*.35,-r*.1)}g.closePath();g.fill();g.stroke();g.restore()}g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(0,0,r*.28,0,7);g.fill();g.fillStyle='#334155';g.beginPath();g.arc(0,0,r*.15,0,7);g.fill();g.restore()}function addEnemy(boss=false){let side=Math.floor(Math.random()*4),x=side===0?-20:side===1?820:Math.random()*800,y=side===2?-20:side===3?470:Math.random()*450,r=Math.random(),type=boss?'boss':r<.3?'ranged':r<.5?'tank':'melee',hp=(boss?400:type==='tank'?160:type==='ranged'?100:70)*1.32**(wave()-1)*1.17**(lv-1);es.push({x,y,type,hp,max:hp,r:boss?30:type==='tank'?22:15,shoot:1000,slow:0,burn:0})}function hit(e,d){if(e.hp<=0)return;e.hp-=d;if(e.hp<=0){money+=e.type==='boss'?90:e.type==='tank'?15:e.type==='ranged'?12:8;if(e.type==='boss')p.hp=Math.min(100,p.hp+20)}}function skill(){if(!run||pause||dead||cd>0)return;cd=11000;let near=es.slice().sort((a,b)=>distance(a,p)-distance(b,p));fx.push({type:lv,x:p.x,y:p.y,t:1200});$('msg').textContent='✨ '+S[lv-1]+'!';switch(lv){case 1:for(let i=0;i<12;i++){let a=i*Math.PI/6;bs.push({x:p.x,y:p.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,t:850,d:atk()*2})}break;case 2:near.slice(0,6).forEach(e=>hit(e,atk()*2.5));break;case 3:es.forEach(e=>{if(distance(e,p)<220){e.burn=4000;hit(e,atk()*2)}});break;case 4:es.forEach(e=>{if(distance(e,p)<240){e.slow=4500;hit(e,atk()*1.5)}});break;case 5:near.slice(0,7).forEach(e=>hit(e,atk()*3));break;case 6:es.forEach(e=>{if(distance(e,p)<260){e.slow=3500;hit(e,atk()*2)}});break;case 7:es.forEach(e=>{if(e.x>p.x-30&&distance(e,p)<310){e.burn=4000;hit(e,atk()*4)}});break;case 8:p.hp=Math.min(100,p.hp+40);p.inv=3500;break;case 9:es.forEach(e=>{e.slow=4000;hit(e,atk()*2)});break;case 10:near.slice(0,9).forEach(e=>hit(e,atk()*3));break;case 11:es.forEach(e=>hit(e,atk()*6));break}es=es.filter(e=>e.hp>0);ui()}function update(dt){if(!run||pause||dead)return;let d=Math.min(dt/16.67,2),old=wave();t+=dt;rot+=.24*d;spawn-=dt;fire-=dt;cd=Math.max(0,cd-dt);p.inv=Math.max(0,p.inv-dt);if(wave()>old&&wave()>=3)addEnemy(true);if(spawn<=0){addEnemy();spawn=Math.max(700,2900-wave()*220)}let dx=Number(!!keys.d||!!keys.arrowright)-Number(!!keys.a||!!keys.arrowleft),dy=Number(!!keys.s||!!keys.arrowdown)-Number(!!keys.w||!!keys.arrowup);if(touch.on){dx=touch.x-p.x;dy=touch.y-p.y;if(Math.hypot(dx,dy)<10){dx=0;dy=0}}let m=Math.hypot(dx,dy)||1;p.x=Math.max(20,Math.min(780,p.x+dx/m*3.8*d));p.y=Math.max(20,Math.min(430,p.y+dy/m*3.8*d));if(fire<=0&&es.length){let e=es.reduce((a,b)=>distance(a,p)<distance(b,p)?a:b),a=Math.atan2(e.y-p.y,e.x-p.x);bs.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,t:1300,d:atk()});fire=Math.max(150,560-lv*30)}for(let e of es){let a=Math.atan2(p.y-e.y,p.x-e.x),dis=distance(e,p),s=(e.slow>0?.35:1)* (e.type==='tank'?1:e.type==='boss'?.9:1.5);e.slow=Math.max(0,e.slow-dt);if(e.type==='ranged'){if(dis<200)s=-1.5;else if(dis<290)s=0}e.x+=Math.cos(a)*s*d;e.y+=Math.sin(a)*s*d;if(dis<e.r+18&&p.inv<=0){p.hp-=e.type==='boss'?24:12;p.inv=700}if(e.type==='ranged'||e.type==='boss'){e.shoot-=dt;if(e.shoot<=0){let n=e.type==='boss'?12:1;for(let i=0;i<n;i++){let z=e.type==='boss'?i*2*Math.PI/n+t*.0006:a;eb.push({x:e.x,y:e.y,vx:Math.cos(z)*3.4,vy:Math.sin(z)*3.4,t:2400})}e.shoot=e.type==='boss'?1500:2100}}if(e.burn>0){e.burn-=dt;hit(e,atk()*.003*d)}}for(let b of bs){b.x+=b.vx*d;b.y+=b.vy*d;b.t-=dt;for(let e of es)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+12){hit(e,b.d);b.t=0;break}}for(let b of eb){b.x+=b.vx*d;b.y+=b.vy*d;b.t-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<20){if(p.inv<=0){p.hp-=10;p.inv=650}b.t=0}}for(let f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);es=es.filter(e=>e.hp>0);bs=bs.filter(b=>b.t>0&&b.x>-30&&b.x<830&&b.y>-30&&b.y<480);eb=eb.filter(b=>b.t>0&&b.x>0&&b.x<800&&b.y>0&&b.y<450);if(p.hp<=0){p.hp=0;dead=true;run=false;$('msg').textContent='💀 게임 오버'}ui()}function draw(){g.fillStyle='#14213a';g.fillRect(0,0,800,450);g.strokeStyle='#243753';for(let x=0;x<800;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,450);g.stroke()}for(let y=0;y<450;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(800,y);g.stroke()}for(let e of es){g.fillStyle=e.type==='boss'?'#a855f7':e.type==='ranged'?'#f59e0b':e.type==='tank'?'#ef4444':'#fb7185';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='#334155';g.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,5);g.fillStyle=e.slow>0?'#7dd3fc':'#fb7185';g.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*Math.max(0,e.hp/e.max),5)}for(let b of eb){g.fillStyle='#ff5577';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}for(let b of bs)spinner(b.x,b.y,10,rot);for(let f of fx){g.strokeStyle=C[f.type-1];g.lineWidth=f.type===4?9:5;g.beginPath();g.arc(f.x,f.y,(1200-f.t)/1200*(f.type===11?550:260),0,7);g.stroke();if(f.type===5||f.type===6){for(let i=0;i<8;i++){let a=i*Math.PI/4+rot;g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x+Math.cos(a)*180,f.y+Math.sin(a)*180);g.stroke()}}}g.fillStyle=p.inv>0?'#6d3754':'#194568';g.beginPath();g.arc(p.x,p.y,23,0,7);g.fill();spinner(p.x,p.y,19,rot);if(!run||pause||dead){g.fillStyle='#050b17bb';g.fillRect(0,0,800,450);g.textAlign='center';g.fillStyle='white';g.font='bold 32px system-ui';g.fillText(dead?'GAME OVER':pause?'PAUSED':'SPINNER ARENA',400,220)}}function frame(now){let dt=last?now-last:16;last=now;update(dt);draw();requestAnimationFrame(frame)}$('start').onclick=()=>{if(dead)reset();run=true;pause=false;ui()};$('pause').onclick=()=>{if(run)pause=!pause};$('reset').onclick=reset;$('buy').onclick=()=>{if(money<cost()){$('msg').textContent='코인이 부족해!';return}money-=cost();owned++;ui()};$('merge').onclick=()=>{if(owned<2||lv>=11)return;owned=1;lv++;cd=0;$('msg').textContent='✨ '+N[lv-1]+' 진화 · '+S[lv-1]+' 해금!';ui()};$('skill').onclick=skill;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='1'&&!e.repeat)skill()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function pos(e){let r=c.getBoundingClientRect();touch.x=(e.clientX-r.left)*800/r.width;touch.y=(e.clientY-r.top)*450/r.height}c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;pos(e);touch.on=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(touch.on)pos(e)});c.addEventListener('pointerup',()=>touch.on=false);c.addEventListener('pointercancel',()=>touch.on=false);reset();requestAnimationFrame(frame)})();
</script></html>
